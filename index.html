
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>猜拳遊戲</title>
  <style>
    body { text-align: center; font-family: sans-serif; margin-top: 50px; }
    button { margin: 10px; padding: 10px 20px; font-size: 18px; }
    #result { margin-top: 20px; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>猜拳遊戲 ✊🖐✌</h1>
  <p>請選擇：剪刀 ✌、石頭 ✊、布 🖐</p>

  <button onclick="play('剪刀')">✌ 剪刀</button>
  <button onclick="play('石頭')">✊ 石頭</button>
  <button onclick="play('布')">🖐 布</button>

  <div id="result"></div>

  <script>
    function play(user) {
      const choices = ['剪刀', '石頭', '布'];
      const computer = choices[Math.floor(Math.random() * 3)];
      let result = '';

      if (user === computer) {
        result = '平手！';
      } else if (
        (user === '剪刀' && computer === '布') ||
        (user === '石頭' && computer === '剪刀') ||
        (user === '布' && computer === '石頭')
      ) {
        result = '你贏了！';
      } else {
        result = '你輸了！';
      }

      document.getElementById('result').innerText =
        `你出：${user}\n電腦出：${computer}\n結果：${result}`;
    }
  </script>
</body>
</html>
